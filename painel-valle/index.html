<body>

<div class="mobile-topbar">
  <button class="menu-btn" id="menuBtn">&#9776;</button>
  <img src="logo-dovalle.png" alt="Do Valle" data-brand-logo>
  <strong>Painel de Controle</strong>
</div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <button type="button" class="sidebar-collapse-btn" id="sidebarCollapseBtn" title="Recolher menu">‹</button>
    <div class="brand">
      <div class="logo-frame">
        <img src="logo-dovalle.png" alt="Do Valle Transportadora" data-brand-logo>
      </div>
      <div class="brand-txt">
        <div class="brand-title">PAINEL DE CONTROLE</div>
        <div class="brand-sub">Rede Do Valle / Real Vale</div>
      </div>
    </div>
    <nav class="side-nav" id="tabsNav"></nav>
    <div class="sidebar-footer">
      <b>Do Valle Transportadora</b><br>
      Visão operacional · Tambasa
    </div>
  </aside>

  <div class="content-area">
    <div class="content-header">
      <div class="ch-title">
        <div class="crumb"><span id="crumbArea">Visão operacional</span></div>
        <h1 id="pageTitle">Dashboard</h1>
      </div>
      <span class="scope-badge scope-operacao" id="scopeBadge" title="A que operação esta tela pertence"></span>
      <div class="ch-right">
        <button type="button" class="ch-btn" id="btnAbrirVO" title="Abrir a Visão da Operação em tela cheia">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.2"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.2"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.2"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.2"/></svg>
          Visão da Operação
        </button>
        <div class="today" id="todayLabel"></div>
      </div>
    </div>
    <main id="mainContent"></main>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
