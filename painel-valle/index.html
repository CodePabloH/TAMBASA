<script>
/* Carrega o painel só depois que o IndexedDB estiver pronto (dados já migrados para a memória). */
(function(){
  var BUILD = "idb1", domPronto = document.readyState === "complete";
  document.addEventListener("DOMContentLoaded", function(){ domPronto = true; });
  var arquivos = [
    "auth-login.js?v=1.2",
    "exportar-excel.js",
    "exportar-dashboard.js",
    "exportar-ocorrencias.js",
    "exportar-fechamento.js",
    "exportar-unidade.js",
    "entregas-previstas.js?v=1.1",
    "entregas-ssw.js?v=1.3",
    "acompanhamento-pacotes.js?v=1.2",
    "analise-parsers.js?v=2.0",
    "analise-gerencial.js?v=2.3",
    "dashboard-principal.js?v=2.4",
    "filmagens-breno.js?v=1.3",
    "breno-focal.js?v=1.0",
    "visao-operacao.js?v=3.1",
    "indenizacao.js?v=1.8",
    "sla-acompanhamento.js?v=1.1",
    "impacto-supervisao.js?v=1.0",
    "cotacoes-comercial.js?v=1.4",
    "alerta-pdf.js?v=1.0",
    "sacflow-core.js?v=1.0",
    "sacflow.js?v=4.2",
    "sacflow-comparacao.js?v=1.0",
    "performance-teste-core.js?v=9.13",
    "performance-teste.js?v=9.18",
    "ocorrencias-culpa.js?v=1.2",
    "dashboard-rede.js?v=2.2",
    "comparacao-unidades.js?v=3.3",
    "atrasos-logo.js?v=1.0",
    "atrasos-transportadora.js?v=1.1",
    "performance-atrasos.js?v=1.1",
    "app.js?v=1.9",
    "bi-valle.js?v=1.0",
    "backup-ui.js?v=1.0",
    "area-hub.js?v=1.0",
    "papeis.js?v=1.0",
    "sync-supabase.js?v=1.4"
  ];
  /* Os arquivos são BAIXADOS ao mesmo tempo (async=false = baixa em paralelo, mas EXECUTA na ordem da lista).
     Antes era um por vez (33 idas e voltas em fila) — era isso que deixava a tela de login lenta. */
  window.PAINEL_PRONTO = new Promise(function(r){ window.__painelProntoRes = r; });
  var restantes = arquivos.length;
  function fim(){
    if(--restantes > 0) return;
    // os scripts foram carregados depois do evento original; reenvia para quem espera DOMContentLoaded
    if(domPronto || document.readyState === "complete") document.dispatchEvent(new Event("DOMContentLoaded", {bubbles:true, cancelable:true}));
    window.__painelProntoRes();
  }
  function injetaTodos(){
    arquivos.forEach(function(src){
      src += (src.indexOf("?") > -1 ? "&" : "?") + "b=" + BUILD;
      var el = document.createElement("script");
      el.src = src;
      el.async = false;
      el.onload = fim;
      el.onerror = function(){ console.error("Falha ao carregar " + src); fim(); };
      document.body.appendChild(el);
    });
  }
  // segurança: se algo travar, não deixa a cobertura de abertura para sempre
  setTimeout(function(){ var c = document.getElementById("bootCover"); if(c) c.remove(); }, 20000);
  window.LS_READY.then(injetaTodos, injetaTodos);
})();
</script>
