<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tambasa | Painel de Controle</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>

<div class="mobile-topbar">
  <button class="menu-btn" id="menuBtn">&#9776;</button>
  <img src="logo.png" alt="Tambasa" data-brand-logo>
  <strong>Painel Tambasa</strong>
</div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo-frame">
        <img src="logo.png" alt="Tambasa Atacadistas" data-brand-logo>
      </div>
      <div class="brand-title">PAINEL DE CONTROLE</div>
      <div class="brand-sub">Rede Do Valle / Real Vale</div>
    </div>
    <nav class="side-nav" id="tabsNav"></nav>
    <div class="theme-switch-wrap">
      <button type="button" class="theme-switch" id="themeSwitch" title="Alternar visual (modo apresentação)">
        <span class="theme-swatch"></span>
        <span class="theme-switch-label" id="themeSwitchLabel">Visual Do Valle</span>
      </button>
    </div>
    <div class="sidebar-footer">
      Tambasa Atacadistas<br>
      Gestão de trocas, boletos e pendências
    </div>
  </aside>

  <div class="content-area">
    <div class="content-header">
      <div>
        <div class="crumb">Tambasa</div>
        <h1 id="pageTitle">Dashboard</h1>
      </div>
      <div class="today" id="todayLabel"></div>
    </div>
    <main id="mainContent"></main>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="exportar-excel.js"></script>
<script src="exportar-fechamento.js"></script>
<script src="app.js"></script>
</body>
</html>
